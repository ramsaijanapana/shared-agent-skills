name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Validate package structure
        run: python scripts/validate.py

      - name: Check version sync
        run: python scripts/sync_version.py --check

      - name: Check version badge
        run: python scripts/check_version_badge.py

      - name: Check plugin sync
        run: python scripts/check_plugin_sync.py

      - name: Ruff lint (scripts)
        run: ruff check scripts tests

      - name: Ruff format (scripts)
        run: ruff format --check scripts tests

      - name: Run tests
        run: pytest -q --cov=scripts --cov-report=term-missing --cov-fail-under=80

  install-smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test install.sh (non-destructive)
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_HOME="$TMP/claude"
          export CODEX_HOME="$TMP/codex"
          sh ./install.sh both
          test -f "$CLAUDE_HOME/skills/agent-routing-orchestrator/SKILL.md"
          test -f "$CODEX_HOME/skills/agent-routing-orchestrator/SKILL.md"

  install-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test install.ps1 (non-destructive)
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "install-smoke")
          $codex = Join-Path $tmp "codex"
          & ./install.ps1 -Target codex -CodexHome $codex
          $skill = Join-Path $codex "skills/agent-routing-orchestrator/SKILL.md"
          if (-not (Test-Path -LiteralPath $skill)) {
            Write-Error "Expected skill file at $skill"
            exit 1
          }
