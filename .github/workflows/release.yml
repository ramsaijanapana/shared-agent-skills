name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Validate package structure
        run: python scripts/validate.py

      - name: Check version sync
        run: python scripts/sync_version.py --check

      - name: Check version badge
        run: python scripts/check_version_badge.py

      - name: Check plugin sync
        run: python scripts/check_plugin_sync.py

      - name: Run tests
        run: pytest -q --cov=scripts --cov-report=term-missing --cov-fail-under=80

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(PYTHONPATH=scripts python -c "from sync_version import read_openpackage_version; from pathlib import Path; print(read_openpackage_version(Path('.')))")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG does not match openpackage.yml version $PKG_VERSION"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -c "
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          notes = match.group(1).strip() if match else f'Release {version}. See CHANGELOG.md for details.'
          open('release-notes.md', 'w', encoding='utf-8').write(notes)
          " "$VERSION"

      - name: Generate release checksums
        run: sha256sum openpackage.yml install.sh install.ps1 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: checksums.txt
          draft: false
          prerelease: false
