[project]
name = "shared-agent-skills"
version = "0.5.0"
description = "Development tooling for shared-agent-skills validation and tests."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["validate", "sync_version", "check_plugin_sync", "check_version_badge"]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true
